spring.application.name=budgeting-backend

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/budget_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'

# Do not create or modify database tables automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Temporary: enable after the first approved Flyway migration is ready
spring.flyway.enabled=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Login rate limiting
app.security.login-rate-limit.max-attempts=10
app.security.login-rate-limit.window-minutes=15
app.security.login-rate-limit.trust-proxy=${TRUST_PROXY:false}