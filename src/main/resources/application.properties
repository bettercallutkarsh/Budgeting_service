spring.application.name=budgeting-backend

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/budget_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Do not create or modify database tables automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Temporary: enable after the first approved Flyway migration is ready
spring.flyway.enabled=false